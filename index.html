<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>雀聖對決</title>
<link rel="stylesheet" href="style.css?v=13">
</head>
<body>
  <div id="topbar">
    <span class="brand">雀聖對決</span>
    <span class="info">第 <b id="round-num">-</b> 局</span>
    <span class="stat suit" id="suit-stamp" style="display:none">
      <span class="stat-label">本場寶牌</span>
      <span id="suit-name"></span>
    </span>
    <span class="info" id="wager-info"></span>
    <span class="spacer"></span>
    <span class="info">持分 <b id="credits">-</b></span>
    <label id="autoplay-label"><input type="checkbox" id="auto-toggle">自動玩</label>
  </div>

  <div id="table">
    <div class="zone" id="ai-zone">
      <div class="row">
        <span class="zone-label">莊家</span>
        <span class="badge dealer" id="dealer-ai" style="display:none">莊</span>
        <span class="badge ting" id="ting-ai" style="display:none">聽</span>
        <span class="badge fold" id="fold-ai" style="display:none">棄和</span>
        <div id="ai-hand"></div>
        <div class="melds" id="ai-melds"></div>
      </div>
    </div>

    <div id="center">
      <div class="river" id="ai-river"></div>
      <div class="wall-info">手<br><b id="wall-count">-</b></div>
      <div class="river" id="p-river"></div>
    </div>

    <div class="zone" id="p-zone">
      <div class="row" id="p-info">
        <span class="zone-label">你</span>
        <span class="badge dealer" id="dealer-you" style="display:none">莊</span>
        <span class="badge ting" id="ting-you" style="display:none">聽</span>
        <span class="stat mult" id="mult-badge" style="display:none">
          <span class="stat-label">過水倍數</span>
          <span class="stat-value"><b id="mult-value">×1</b><i id="mult-times"></i></span>
        </span>
        <div id="ting-live"></div>
        <div id="actions"></div>
      </div>
      <div class="row" id="p-panel"><div class="melds" id="p-melds"></div><div id="p-hand"></div></div>
    </div>
  </div>

  <div id="betsel">
    <div id="bs-roster"></div>
    <div id="betsel-card">
      <div class="bs-logo"><img src="assets/logo.png?v=6" alt="雀聖對決"></div>
      <div class="bs-difftabs">
        <button class="bs-difftab" id="diff-rookie">新手桌</button>
        <button class="bs-difftab" id="diff-expert">高手桌</button>
        <button class="bs-difftab" id="diff-master">大師桌</button>
      </div>
      <div class="bs-mid">
        <div class="bs-panel">
          <div class="bs-line">贏分無上限，最多輸 16 倍</div>
          <div class="bs-line big" id="bs-range"></div>
          <div class="bs-line">底注 <span id="bs-base" class="bs-req">100</span></div>
          <div class="bs-line" id="bs-dora"></div>
          <div class="bs-line small" id="bs-ainote"></div>
          <div class="bs-line small">持分 <span id="bs-credits"></span></div>
        </div>
      </div>
      <div class="bs-bottom">
        <div class="bs-stepper">
          <button id="bs-minus">−</button>
          <div class="bs-amount-box"><b id="bs-amount">1600</b><span>總投注額（最多輸）</span></div>
          <button id="bs-plus">＋</button>
        </div>
        <button id="bs-start">開局</button>
        <label id="bs-autonext-label"><input type="checkbox" id="bs-autonext">自動<br>下一局</label>
      </div>
    </div>
  </div>

  <div id="vs-anim">
    <div id="vs-inner">
      <div id="vs-tag">本局對手</div>
      <div id="vs-word">VS</div>
      <img id="vs-img" alt="">
      <div id="vs-name"></div>
    </div>
  </div>

  <div id="suit-anim">
    <div id="suit-inner">
      <div id="suit-title">本場寶牌</div>
      <div id="suit-stage">
        <span id="suit-ring"></span>
        <span id="suit-big"></span>
      </div>
      <div id="suit-note">持有一張 ＋1 台</div>
    </div>
  </div>

  <div id="bonus">
    <div id="bonus-card">
      <div id="bonus-title"></div>
      <div id="bonus-note"></div>
      <div id="bonus-pool"></div>
      <button id="bonus-confirm">開牌結算</button>
    </div>
  </div>

  <div id="overlay">
    <div id="ov-card">
      <div id="ov-title"></div>
      <div id="ov-hand"></div>
      <div id="ov-fans"></div>
      <div id="ov-net"></div>
      <div id="ov-cap"></div>
      <button id="next-btn">下一局</button>
    </div>
  </div>

  <div id="opp-char">
    <img id="opp-img" alt="">
    <div id="opp-name"></div>
  </div>

  <label id="autonext-label"><input type="checkbox" id="autonext-toggle">自動下一局（同桌型同注額，對手重抽）</label>

  <div id="debug">
    <button id="debug-toggle">⚙</button>
    <div id="debug-body"></div>
  </div>

  <script src="data.js?v=12"></script>
  <script src="game.js?v=15"></script>
</body>
</html>
